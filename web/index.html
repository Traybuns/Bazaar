<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Bazaar</title>
<style>
:root{--ink:#17212b;--paper:#e9edf0;--card:#fff;--line:#c9d1d8;--green:#0e6b47;--amber:#b7791f;--mute:#6b7885;--ledger:#17212b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:32px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:2rem;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 10px}
.lede{color:var(--mute);margin:0 0 20px;max-width:34rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
textarea{width:100%;min-height:96px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;resize:vertical}
button,.btn{font:inherit;font-weight:600;background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid #2b7fff;outline-offset:2px}
.item{border-top:1px solid var(--line);padding:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.price{font-weight:700;font-variant-numeric:tabular-nums}.was{color:var(--mute);text-decoration:line-through;font-weight:400;margin-right:6px}
.ok{color:var(--green)}.bad{color:#a12b2b}.mute{color:var(--mute);font-size:.9rem}
.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}
#ledger{background:var(--ledger);color:#dfe6ec;border-color:var(--ledger);max-height:78vh;overflow:auto;grid-row:span 2}
#ledger h2{color:#fff}
.msg{padding:9px 0;border-top:1px solid #2c3948;font-size:.92rem}
.msg b{color:#fff}.msg .kind{color:#9fb3c4}.msg .data{color:#8497a8;font-size:.85rem;overflow-wrap:anywhere}
.chain{font-size:.9rem;margin-bottom:6px}.chain.ok{color:#6ee7b0}.chain.bad{color:#ff8f8f}
</style>
</head>
<body>
<main>
  <div>
    <h1>Agent Bazaar</h1>
    <p class="lede">Ask once. Business agents across Nigeria check each other’s signatures, compare prices and hold a date for you. Nothing is booked until you confirm.</p>
    <section>
      <label for="ask"><h2>What do you need?</h2></label>
      <textarea id="ask">Book my birthday shoot in Abuja for Saturday, photographer under ₦80k + cake for 20 people</textarea>
      <p><button id="go">Find and negotiate</button></p>
    </section>
  </div>
  <section id="ledger" aria-live="polite">
    <h2>What the agents said to each other</h2>
    <div id="chain" class="chain"></div>
    <div id="log"><p class="mute">Messages will appear here as agents talk.</p></div>
  </section>
  <section id="result" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const naira=n=>"₦"+Number(n).toLocaleString("en-NG");
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
const KIND={request:"asked",discover:"searched the registry",verify:"checked a signature",quote_request:"asked for a quote",quote:"replied with a quote",counter_offer:"made an offer",accept:"accepted",book_request:"asked to book",book_response:"replied to the booking",register:"registered"};
const summary=p=>Object.entries(p).filter(([,v])=>typeof v!=="object"||v===null).map(([k,v])=>k.replace("_"," ")+" "+(typeof v==="number"&&v>999?naira(v):v)).join(", ");
let proposal=null;

async function loadAudit(){
  const a=await fetch("/api/audit").then(r=>r.json());
  $("chain").className="chain "+(a.chain_ok?"ok":"bad");
  $("chain").textContent=a.chain_ok?`Log chain intact, ${a.entries.length} messages`:"Log chain broken: an entry was changed";
  $("log").innerHTML=a.entries.slice().reverse().map(e=>`<div class="msg"><b>${esc(e.from)}</b> <span class="kind">${KIND[e.kind]||e.kind}</span> <b>${esc(e.to)}</b><div class="data">${esc(summary(e.payload))}</div></div>`).join("");
}

function render(p){
  const box=$("result"); box.hidden=false;
  if(p.error){box.innerHTML=`<p class="bad">${esc(p.error)}</p>`;return}
  proposal=p;
  box.innerHTML=`<h2>Proposed bundle for ${esc(p.date)}${p.city?" in "+esc(p.city):""}</h2>`+p.items.map(i=>i.status==="ok"
    ?`<div class="item"><div class="row"><span>${esc(i.category)} · <a href="${esc(i.agent.url)}" target="_blank" rel="noopener">${esc(i.agent.name)}</a></span><span class="price">${i.list_price>i.price?`<span class="was">${naira(i.list_price)}</span>`:""}${naira(i.price)}</span></div><div class="mute ok">Signature verified</div></div>`
    :`<div class="item"><div class="row"><span>${esc(i.category)}</span><span class="bad">No match</span></div><div class="mute">${esc(i.notes.join("; ")||"No agent found")}</div></div>`).join("")
    +`<div class="row total"><b>Total</b><span class="price">${naira(p.total)}</span></div>`
    +(p.complete?`<p><button id="confirm">Confirm booking</button></p>`:`<p class="mute">Nothing was booked. Try another date or a higher budget.</p>`);
  if(p.complete)$("confirm").onclick=confirm;
}

async function confirm(){
  $("confirm").disabled=true;
  const r=await post("/api/confirm",{proposal_id:proposal.id});
  $("result").innerHTML=r.error?`<p class="bad">${esc(r.error)}</p>`:`<h2>Booking results</h2>`+r.bookings.map(b=>b.status==="confirmed"
    ?`<div class="item"><div class="row"><span>${esc(b.category)} · ${esc(b.agent)}</span><span class="price">${esc(b.receipt.booking_id)}</span></div><div class="mute ok">Receipt signature verified</div>${b.whatsapp?`<p><a class="btn" href="${esc(b.whatsapp)}" target="_blank" rel="noopener">Message on WhatsApp</a></p>`:""}</div>`
    :`<div class="item bad">${esc(b.category)}: ${esc(b.reason||b.status)}</div>`).join("");
  loadAudit();
}

$("go").onclick=async()=>{
  $("go").disabled=true; $("result").hidden=false; $("result").innerHTML='<p class="mute">Agents are talking…</p>';
  try{render(await post("/api/plan",{text:$("ask").value}))}catch(e){$("result").innerHTML='<p class="bad">The planner could not be reached. Check that it is running.</p>'}
  $("go").disabled=false; loadAudit();
};
loadAudit();
</script>
</body>
</html>
