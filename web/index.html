<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Bazaar</title>
<style>
:root{--ink:#1c1a2e;--indigo:#1f2a6b;--night:#141b4a;--gold:#f4b223;--clay:#c8512d;--berry:#b0266b;--leaf:#0f7a4f;--sand:#f8e9c8;--mute:#6a5f55}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.awning{height:30px;border-bottom:4px solid var(--ink);background:repeating-linear-gradient(90deg,var(--clay) 0 30px,var(--gold) 30px 60px,var(--indigo) 60px 90px,var(--leaf) 90px 120px,#fff 120px 150px)}
main{max-width:1120px;margin:0 auto;padding:28px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{font:700 3rem/1 Georgia,"Times New Roman",serif;color:var(--indigo);margin:0 0 10px;letter-spacing:-.02em}
h2{font:700 1.25rem/1.2 Georgia,serif;margin:0 0 12px}
.lede{max-width:34rem;margin:0 0 14px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.chips li{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:.9rem;background:#fff}
.stall,.card{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:6px 6px 0 var(--indigo)}
textarea{width:100%;min-height:100px;font:inherit;padding:12px;border:2px solid var(--ink);border-radius:12px;resize:vertical;background:#fffdf7}
button,.btn{font:inherit;font-weight:700;background:var(--gold);color:var(--night);border:2px solid var(--ink);border-radius:12px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:3px 3px 0 var(--ink)}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.55;cursor:wait}
a{color:var(--indigo)}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
#result{grid-column:1}
.item{--c:var(--indigo);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;margin:0 0 16px;box-shadow:5px 5px 0 var(--c);background:#fff}
.cat-photography{--c:var(--indigo)}.cat-cake{--c:var(--clay)}.cat-makeup{--c:var(--berry)}.cat-none{--c:var(--mute)}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:1px 12px;font-size:.88rem;font-weight:700;margin-right:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.price{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.was{color:var(--mute);text-decoration:line-through;font-weight:400;margin-right:8px;font-size:.95rem}
.ok{color:var(--leaf);font-weight:700}.bad{color:#a12b2b;font-weight:700}.mute{color:var(--mute);font-size:.92rem}
.total{background:var(--gold);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;margin:6px 0 16px}
#ledger{background:var(--night);background-image:radial-gradient(#ffffff1f 1.5px,transparent 1.6px);background-size:18px 18px;color:#e9ecff;border-radius:16px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--clay);padding:20px;max-height:80vh;overflow:auto;grid-row:span 2;grid-column:2}
@media(max-width:820px){#ledger{grid-column:1;grid-row:auto;max-height:none}}
#ledger h2{color:#fff}
.chain{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.88rem;font-weight:700;margin:0 0 12px}
.chain.ok{background:#bdf0d7;color:#0a4d33}.chain.bad{background:#ffd0d0;color:#7a1414}
.msg{background:#ffffff14;border-radius:14px 14px 14px 4px;padding:9px 13px;margin:0 0 9px;font-size:.93rem}
.msg b{color:var(--gold)}.msg .kind{color:#c9d0ff}.msg .data{color:#aab3e6;font-size:.84rem;overflow-wrap:anywhere;margin-top:2px}
</style>
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<main>
  <div>
    <h1>Agent Bazaar</h1>
    <p class="lede">Ask once. Business agents across Nigeria check each other’s signatures, compare prices and hold your date. Nothing is booked until you say yes.</p>
    <ul class="chips"><li>Signed agents</li><li>No card charged</li><li>Every message logged</li></ul>
    <section class="stall">
      <label for="ask"><h2>What do you need?</h2></label>
      <textarea id="ask">Book my birthday shoot in Abuja for Saturday, photographer under ₦80k + cake for 20 people</textarea>
      <p style="margin:14px 0 0"><button id="go">Find and negotiate</button></p>
    </section>
  </div>
  <section id="ledger" aria-live="polite">
    <h2>Market talk</h2>
    <div id="chain" class="chain"></div>
    <div id="log"><p class="mute" style="color:#aab3e6">Messages will appear here as the agents talk.</p></div>
  </section>
  <section id="result" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const naira=n=>"₦"+Number(n).toLocaleString("en-NG");
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
const KIND={request:"asked",discover:"searched the registry",verify:"checked a signature",quote_request:"asked for a quote",quote:"replied with a quote",counter_offer:"made an offer",accept:"accepted",book_request:"asked to book",book_response:"replied to the booking",register:"registered"};
const summary=p=>Object.entries(p).filter(([,v])=>typeof v!=="object"||v===null).map(([k,v])=>k.replace("_"," ")+" "+(typeof v==="number"&&v>999?naira(v):v)).join(", ");
let proposal=null;

async function loadAudit(){
  const a=await fetch("/api/audit").then(r=>r.json());
  $("chain").className="chain "+(a.chain_ok?"ok":"bad");
  $("chain").textContent=a.chain_ok?`Log intact · ${a.entries.length} messages`:"Log broken: an entry was changed";
  $("log").innerHTML=a.entries.slice().reverse().map(e=>`<div class="msg"><b>${esc(e.from)}</b> <span class="kind">${KIND[e.kind]||e.kind}</span> <b>${esc(e.to)}</b><div class="data">${esc(summary(e.payload))}</div></div>`).join("");
}

function render(p){
  const box=$("result"); box.hidden=false;
  if(p.error){box.innerHTML=`<p class="bad">${esc(p.error)}</p>`;return}
  proposal=p;
  box.innerHTML=`<h2>Your bundle for ${esc(p.date)}${p.city?" in "+esc(p.city):""}</h2>`+p.items.map(i=>i.status==="ok"
    ?`<div class="item cat-${esc(i.category)}"><div class="row"><span><span class="tag">${esc(i.category)}</span><a href="${esc(i.agent.url)}" target="_blank" rel="noopener">${esc(i.agent.name)}</a></span><span class="price">${i.list_price>i.price?`<span class="was">${naira(i.list_price)}</span>`:""}${naira(i.price)}</span></div><div class="ok">Signature verified</div></div>`
    :`<div class="item cat-none"><div class="row"><span><span class="tag">${esc(i.category)}</span>No match</span></div><div class="mute">${esc(i.notes.join("; ")||"No agent found")}</div></div>`).join("")
    +`<div class="row total"><b>Total</b><span class="price">${naira(p.total)}</span></div>`
    +(p.complete?`<button id="confirm">Confirm booking</button>`:`<p class="mute">Nothing was booked. Try another date or a higher budget.</p>`);
  if(p.complete)$("confirm").onclick=confirm;
}

async function confirm(){
  $("confirm").disabled=true;
  const r=await post("/api/confirm",{proposal_id:proposal.id});
  $("result").innerHTML=r.error?`<p class="bad">${esc(r.error)}</p>`:`<h2>You are booked</h2>`+r.bookings.map(b=>b.status==="confirmed"
    ?`<div class="item cat-${esc(b.category)}"><div class="row"><span><span class="tag">${esc(b.category)}</span>${esc(b.agent)}</span><span class="price">${esc(b.receipt.booking_id)}</span></div><div class="ok">Receipt signature verified</div>${b.whatsapp?`<p style="margin:10px 0 0"><a class="btn" href="${esc(b.whatsapp)}" target="_blank" rel="noopener">Message on WhatsApp</a></p>`:""}</div>`
    :`<div class="item cat-none bad">${esc(b.category)}: ${esc(b.reason||b.status)}</div>`).join("");
  loadAudit();
}

$("go").onclick=async()=>{
  $("go").disabled=true; $("result").hidden=false; $("result").innerHTML='<p class="mute">The agents are talking…</p>';
  try{render(await post("/api/plan",{text:$("ask").value}))}catch(e){$("result").innerHTML='<p class="bad">The planner could not be reached. Check that it is running.</p>'}
  $("go").disabled=false; loadAudit();
};
loadAudit();
</script>
</body>
</html>
